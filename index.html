<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newquay Weather Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --school-gold: #f9b149;
      --school-blue: #25408f;
      --school-black: #000000;

      --bg-top: #6fc2ff;
      --bg-bottom: #dff2ff;

      --text: #000000;
      --muted: #1e2d57;
      --soft: #3c4f8f;
      --accent: #25408f;

      --glass: rgba(255, 255, 255, 0.16);
      --glass-strong: rgba(255, 255, 255, 0.82);
      --border: rgba(37, 64, 143, 0.22);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      --title-bar: linear-gradient(90deg, #25408f 0%, #1d3270 100%);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      transition: background 1s ease, color 0.6s ease;
      position: relative;
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .gradient-backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 14%, rgba(255,255,255,0.35), transparent 15%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      transition: background 1s ease;
    }

    .sun-glow,
    .moon-glow,
    .stars,
    .clouds,
    .clouds2,
    .mist,
    .rain,
    .snow,
    .lightning {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .sun-glow {
      background:
        radial-gradient(circle at 78% 15%, rgba(249, 177, 73, 0.95) 0%, rgba(249, 177, 73, 0.55) 8%, rgba(249, 177, 73, 0.12) 16%, transparent 24%);
      filter: blur(2px);
    }

    .moon-glow {
      background:
        radial-gradient(circle at 78% 15%, rgba(244,246,255,0.65) 0%, rgba(244,246,255,0.28) 7%, transparent 16%);
    }

    .stars {
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 18% 72%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 26% 40%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 33% 18%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 41% 61%, rgba(255,255,255,0.85) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 28%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 76%, rgba(255,255,255,0.85) 0 1px, transparent 2px),
        radial-gradient(circle at 71% 36%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 58%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 24%, rgba(255,255,255,0.8) 0 1px, transparent 2px);
      animation: twinkle 4s linear infinite;
    }

    .clouds::before,
    .clouds::after,
    .clouds2::before,
    .clouds2::after {
      content: "";
      position: absolute;
      width: 38vw;
      height: 14vw;
      background:
        radial-gradient(circle at 20% 60%, rgba(255,255,255,0.70) 0 18%, transparent 19%),
        radial-gradient(circle at 40% 45%, rgba(255,255,255,0.78) 0 22%, transparent 23%),
        radial-gradient(circle at 60% 55%, rgba(255,255,255,0.75) 0 21%, transparent 22%),
        radial-gradient(circle at 78% 62%, rgba(255,255,255,0.68) 0 17%, transparent 18%);
      filter: blur(8px);
    }

    .clouds::before { top: 7%; left: -10%; animation: drift1 70s linear infinite; }
    .clouds::after  { top: 24%; left: 18%; animation: drift2 95s linear infinite; }
    .clouds2::before { top: 12%; left: 45%; transform: scale(0.85); opacity: 0.85; animation: drift3 85s linear infinite; }
    .clouds2::after  { top: 31%; left: -25%; transform: scale(1.15); opacity: 0.65; animation: drift4 120s linear infinite; }

    .mist::before,
    .mist::after {
      content: "";
      position: absolute;
      left: -10%;
      width: 120%;
      height: 18%;
      background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.35), rgba(255,255,255,0.08));
      filter: blur(16px);
      border-radius: 999px;
    }

    .mist::before { top: 28%; animation: mistMove1 22s ease-in-out infinite alternate; }
    .mist::after  { top: 48%; animation: mistMove2 28s ease-in-out infinite alternate; }

    .rain {
      background-image:
        linear-gradient(transparent 0%, rgba(255,255,255,0.0) 10%, rgba(200,225,255,0.55) 11%, rgba(200,225,255,0.05) 12%, transparent 13%),
        linear-gradient(transparent 0%, rgba(255,255,255,0.0) 26%, rgba(200,225,255,0.52) 27%, rgba(200,225,255,0.05) 28%, transparent 29%),
        linear-gradient(transparent 0%, rgba(255,255,255,0.0) 41%, rgba(200,225,255,0.48) 42%, rgba(200,225,255,0.05) 43%, transparent 44%);
      background-size: 18px 140px, 22px 160px, 26px 180px;
      animation: rainFall 0.7s linear infinite;
      opacity: 0.9;
    }

    .snow::before,
    .snow::after {
      content: "";
      position: absolute;
      inset: -10% 0 0 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.85) 0 1.5px, transparent 2.5px),
        radial-gradient(circle, rgba(255,255,255,0.9) 0 2px, transparent 3px);
      background-size: 140px 140px, 180px 180px, 220px 220px;
      animation: snowFall1 14s linear infinite;
    }

    .snow::after {
      opacity: 0.7;
      transform: scale(1.1);
      animation: snowFall2 20s linear infinite;
    }

    .lightning::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.0);
      animation: lightningFlash 7s infinite;
    }

    .screen {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      padding: 18px 22px 10px;
      display: grid;
      grid-template-rows:
        minmax(180px, 1.15fr)
        26px
        minmax(120px, 0.9fr)
        26px
        minmax(135px, 0.95fr)
        42px;
      gap: 8px;
    }

    .top {
      display: grid;
      grid-template-columns: 1.65fr 0.95fr;
      gap: 14px;
      min-height: 0;
    }

    .hero {
      background: var(--glass);
      border: 2px solid rgba(37, 64, 143, 0.18);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .location {
      display: inline-block;
      width: fit-content;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      background: var(--title-bar);
      padding: 8px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 6px 18px rgba(37, 64, 143, 0.18);
    }

    .main-line {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .temp {
      font-size: clamp(74px, 8vw, 112px);
      font-weight: 800;
      line-height: 0.9;
      color: var(--school-black);
      text-shadow: 0 2px 0 rgba(255,255,255,0.25);
    }

    .hero-icon {
      font-size: clamp(54px, 5vw, 78px);
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 180px;
    }

    .condition {
      font-size: clamp(24px, 2.3vw, 34px);
      font-weight: 700;
      color: var(--school-blue);
      line-height: 1.1;
    }

    .updated {
      font-size: 16px;
      color: #2e437f;
      font-weight: 600;
    }

    .side-card,
    .hour-card,
    .forecast-card {
      background: var(--glass-strong);
      border: 2px solid rgba(37, 64, 143, 0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .side-card {
      border-radius: 24px;
      padding: 16px 18px;
      display: grid;
      align-content: center;
      gap: 8px;
      min-height: 0;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: clamp(17px, 1.5vw, 22px);
      color: var(--muted);
      border-bottom: 1px solid rgba(37, 64, 143, 0.14);
      padding-bottom: 8px;
    }

    .metric:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .metric strong {
      color: var(--school-black);
      font-weight: 800;
    }

    .section-title {
      display: flex;
      align-items: end;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1;
      padding-left: 12px;
      background: var(--title-bar);
      border-radius: 10px;
      padding-top: 6px;
      padding-bottom: 6px;
      width: fit-content;
      min-width: 180px;
      box-shadow: 0 6px 18px rgba(37, 64, 143, 0.15);
    }

    .hourly-row {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      min-height: 0;
    }

    .hour-card {
      border-radius: 16px;
      padding: 10px 6px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .hour-time {
      font-size: 15px;
      font-weight: 800;
      color: var(--school-blue);
      margin-bottom: 6px;
    }

    .hour-icon {
      font-size: 26px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .hour-temp {
      font-size: 20px;
      font-weight: 800;
      color: var(--school-black);
      margin-bottom: 4px;
    }

    .hour-rain {
      font-size: 13px;
      color: #2e437f;
      line-height: 1.1;
      font-weight: 600;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      min-height: 0;
    }

    .forecast-card {
      border-radius: 18px;
      padding: 12px 8px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .forecast-day {
      font-size: 18px;
      font-weight: 800;
      color: var(--school-blue);
      margin-bottom: 6px;
    }

    .forecast-icon {
      font-size: 32px;
      margin-bottom: 6px;
      line-height: 1;
    }

    .forecast-temps {
      font-size: 21px;
      font-weight: 800;
      color: var(--school-black);
      margin-bottom: 4px;
    }

    .forecast-desc {
      font-size: 14px;
      color: #2e437f;
      line-height: 1.15;
      min-height: 30px;
      font-weight: 600;
    }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 3px solid var(--school-gold);
      color: var(--muted);
      min-height: 0;
      padding-top: 4px;
    }

    .datetime {
      display: flex;
      gap: 18px;
      font-size: 22px;
      font-weight: 800;
      flex-wrap: wrap;
      justify-content: flex-end;
      line-height: 1;
      color: var(--school-black);
      background: rgba(255,255,255,0.72);
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid rgba(37, 64, 143, 0.14);
    }

    @keyframes drift1 {
      from { transform: translateX(0); }
      to { transform: translateX(130vw); }
    }
    @keyframes drift2 {
      from { transform: translateX(0); }
      to { transform: translateX(120vw); }
    }
    @keyframes drift3 {
      from { transform: translateX(0) scale(0.85); }
      to { transform: translateX(90vw) scale(0.85); }
    }
    @keyframes drift4 {
      from { transform: translateX(0) scale(1.15); }
      to { transform: translateX(145vw) scale(1.15); }
    }
    @keyframes rainFall {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 140px, 0 160px, 0 180px; }
    }
    @keyframes snowFall1 {
      from { transform: translateY(-5%) translateX(0); }
      to { transform: translateY(100%) translateX(20px); }
    }
    @keyframes snowFall2 {
      from { transform: translateY(-10%) translateX(-10px) scale(1.1); }
      to { transform: translateY(100%) translateX(25px) scale(1.1); }
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes mistMove1 {
      from { transform: translateX(-3%); }
      to { transform: translateX(3%); }
    }
    @keyframes mistMove2 {
      from { transform: translateX(4%); }
      to { transform: translateX(-4%); }
    }
    @keyframes lightningFlash {
      0%, 92%, 100% { background: rgba(255,255,255,0); }
      93% { background: rgba(255,255,255,0.32); }
      94% { background: rgba(255,255,255,0); }
      95% { background: rgba(255,255,255,0.18); }
      96% { background: rgba(255,255,255,0); }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="gradient-backdrop"></div>
    <div class="sun-glow" id="sunGlow"></div>
    <div class="moon-glow" id="moonGlow"></div>
    <div class="stars" id="stars"></div>
    <div class="clouds" id="clouds1"></div>
    <div class="clouds2" id="clouds2"></div>
    <div class="mist" id="mist"></div>
    <div class="rain" id="rainLayer"></div>
    <div class="snow" id="snowLayer"></div>
    <div class="lightning" id="lightningLayer"></div>
  </div>

  <div class="screen">
    <div class="top">
      <div class="hero">
        <div class="location" id="location">Newquay, Cornwall</div>
        <div class="main-line">
          <div class="temp" id="temp">--°C</div>
          <div class="hero-icon" id="icon">⛅</div>
          <div class="hero-text">
            <div class="condition" id="condition">Loading…</div>
            <div class="updated" id="updated">Fetching latest forecast…</div>
          </div>
        </div>
      </div>

      <div class="side-card">
        <div class="metric"><span>Feels like</span><strong id="feelsLike">--°C</strong></div>
        <div class="metric"><span>Wind</span><strong id="wind">-- mph</strong></div>
        <div class="metric"><span>Rain today</span><strong id="rain">--%</strong></div>
        <div class="metric"><span>Today</span><strong id="highLow">--° / --°</strong></div>
      </div>
    </div>

    <div class="section-title">Next 8 Hours</div>
    <div class="hourly-row" id="hourlyRow"></div>

    <div class="section-title">5 Day Forecast</div>
    <div class="forecast-row" id="forecastRow"></div>

    <div class="bottom-bar">
      <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
      </div>
    </div>
  </div>

  <script>
    const PLACE_NAME = "Newquay";
    const ADMIN_NAME = "Cornwall";
    const COUNTRY_CODE = "GB";
    const REFRESH_MS = 15 * 60 * 1000;

    const weatherCodeMap = {
      0: { text: "Clear sky", icon: "☀️" },
      1: { text: "Mainly clear", icon: "🌤️" },
      2: { text: "Partly cloudy", icon: "⛅" },
      3: { text: "Overcast", icon: "☁️" },
      45: { text: "Fog", icon: "🌫️" },
      48: { text: "Rime fog", icon: "🌫️" },
      51: { text: "Light drizzle", icon: "🌦️" },
      53: { text: "Drizzle", icon: "🌦️" },
      55: { text: "Dense drizzle", icon: "🌧️" },
      61: { text: "Slight rain", icon: "🌦️" },
      63: { text: "Rain", icon: "🌧️" },
      65: { text: "Heavy rain", icon: "🌧️" },
      71: { text: "Slight snow", icon: "🌨️" },
      73: { text: "Snow", icon: "🌨️" },
      75: { text: "Heavy snow", icon: "❄️" },
      77: { text: "Snow grains", icon: "❄️" },
      80: { text: "Rain showers", icon: "🌦️" },
      81: { text: "Showers", icon: "🌦️" },
      82: { text: "Heavy showers", icon: "⛈️" },
      85: { text: "Snow showers", icon: "🌨️" },
      86: { text: "Heavy snow showers", icon: "❄️" },
      95: { text: "Thunderstorm", icon: "⛈️" },
      96: { text: "Thunderstorm with hail", icon: "⛈️" },
      99: { text: "Thunderstorm with hail", icon: "⛈️" }
    };

    function getWeatherDisplay(code) {
      return weatherCodeMap[code] || { text: "Unknown", icon: "⛅" };
    }

    function formatDayLabel(dateStr, index) {
      const date = new Date(dateStr);
      if (index === 0) return "Today";
      return date.toLocaleDateString("en-GB", { weekday: "short" });
    }

    function formatHourLabel(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function formatUpdatedTime(dateObj) {
      return dateObj.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function cToDisplay(value) {
      return `${Math.round(value)}°`;
    }

    function mph(valueKmh) {
      return `${Math.round(valueKmh * 0.621371)} mph`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("date").textContent = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
      document.getElementById("time").textContent = now.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    async function getCoordinates() {
      const url =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(PLACE_NAME)}` +
        `&count=10&language=en&format=json`;

      const response = await fetch(url);
      if (!response.ok) throw new Error(`Geocoding failed with status ${response.status}`);

      const data = await response.json();
      if (!data.results || !data.results.length) throw new Error("Location not found");

      const exact = data.results.find(
        item =>
          item.name?.toLowerCase() === PLACE_NAME.toLowerCase() &&
          item.country_code === COUNTRY_CODE &&
          (
            item.admin1?.toLowerCase().includes(ADMIN_NAME.toLowerCase()) ||
            item.admin2?.toLowerCase().includes(ADMIN_NAME.toLowerCase()) ||
            item.admin3?.toLowerCase().includes(ADMIN_NAME.toLowerCase()) ||
            item.admin4?.toLowerCase().includes(ADMIN_NAME.toLowerCase())
          )
      ) || data.results.find(item => item.country_code === COUNTRY_CODE) || data.results[0];

      return { latitude: exact.latitude, longitude: exact.longitude };
    }

    function showLayer(id, visible) {
      document.getElementById(id).style.opacity = visible ? "1" : "0";
    }

    function setTheme(theme) {
      const root = document.documentElement;
      for (const [key, value] of Object.entries(theme)) {
        root.style.setProperty(key, value);
      }
    }

    function applyWeatherScene(code, isDay) {
      ["sunGlow","moonGlow","stars","clouds1","clouds2","mist","rainLayer","snowLayer","lightningLayer"]
        .forEach(id => showLayer(id, false));

      if (isDay) {
        if (code === 0) {
          setTheme({
            "--bg-top": "#7fc8ff",
            "--bg-bottom": "#eef8ff",
            "--text": "#000000",
            "--muted": "#1e2d57",
            "--soft": "#3c4f8f",
            "--accent": "#25408f",
            "--glass": "rgba(255,255,255,0.16)",
            "--glass-strong": "rgba(255,255,255,0.84)",
            "--border": "rgba(37, 64, 143, 0.18)"
          });
          showLayer("sunGlow", true);
        } else if (code === 1 || code === 2) {
          setTheme({
            "--bg-top": "#95b9de",
            "--bg-bottom": "#eef4fa",
            "--text": "#000000",
            "--muted": "#1e2d57",
            "--soft": "#3c4f8f",
            "--accent": "#25408f",
            "--glass": "rgba(255,255,255,0.18)",
            "--glass-strong": "rgba(255,255,255,0.84)",
            "--border": "rgba(37, 64, 143, 0.18)"
          });
          showLayer("sunGlow", code === 1);
          showLayer("clouds1", true);
          showLayer("clouds2", true);
        } else if (code === 3) {
          setTheme({
            "--bg-top": "#adb9c8",
            "--bg-bottom": "#edf1f5",
            "--text": "#000000",
            "--muted": "#1e2d57",
            "--soft": "#3c4f8f",
            "--accent": "#25408f",
            "--glass": "rgba(255,255,255,0.18)",
            "--glass-strong": "rgba(255,255,255,0.86)",
            "--border": "rgba(37, 64, 143, 0.18)"
          });
          showLayer("clouds1", true);
          showLayer("clouds2", true);
        } else if ([45, 48].includes(code)) {
          setTheme({
            "--bg-top": "#c2ccd3",
            "--bg-bottom": "#f3f6f8",
            "--text": "#000000",
            "--muted": "#1e2d57",
            "--soft": "#3c4f8f",
            "--accent": "#25408f",
            "--glass": "rgba(255,255,255,0.18)",
            "--glass-strong": "rgba(255,255,255,0.88)",
            "--border": "rgba(37, 64, 143, 0.16)"
          });
          showLayer("mist", true);
        } else if ([51,53,55,61,63,65,80,81,82].includes(code)) {
          setTheme({

    async function fetchWeather() {
      try {
        const coords = await getCoordinates();

        const url =
          `https://api.open-meteo.com/v1/forecast?latitude=${coords.latitude}&longitude=${coords.longitude}` +
          `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day` +
          `&hourly=temperature_2m,weather_code,precipitation_probability` +
          `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
          `&forecast_days=5&timezone=Europe%2FLondon&temperature_unit=celsius&wind_speed_unit=kmh`;

        const response = await fetch(url);
        if (!response.ok) throw new Error(`Weather fetch failed with status ${response.status}`);

        const data = await response.json();
        const current = data.current;
        const hourly = data.hourly;
        const daily = data.daily;

        const currentDisplay = getWeatherDisplay(current.weather_code);
        applyWeatherScene(current.weather_code, current.is_day === 1);

        document.getElementById("location").textContent = "Newquay, Cornwall";
        document.getElementById("temp").textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById("icon").textContent = currentDisplay.icon;
        document.getElementById("condition").textContent = currentDisplay.text;
        document.getElementById("updated").textContent = `Updated at ${formatUpdatedTime(new Date())}`;
        document.getElementById("feelsLike").textContent = `${Math.round(current.apparent_temperature)}°C`;
        document.getElementById("wind").textContent = mph(current.wind_speed_10m);
        document.getElementById("rain").textContent = `${daily.precipitation_probability_max[0] ?? 0}%`;
        document.getElementById("highLow").textContent =
          `${cToDisplay(daily.temperature_2m_max[0])} / ${cToDisplay(daily.temperature_2m_min[0])}`;

        const currentHourIndex = hourly.time.findIndex(t => new Date(t) >= new Date(current.time));
        const startIndex = currentHourIndex >= 0 ? currentHourIndex : 0;
        const endIndex = Math.min(startIndex + 8, hourly.time.length);

        const hourlyRow = document.getElementById("hourlyRow");
        hourlyRow.innerHTML = "";

        for (let i = startIndex; i < endIndex; i++) {
          const display = getWeatherDisplay(hourly.weather_code[i]);
          const card = document.createElement("div");
          card.className = "hour-card";
          card.innerHTML = `
            <div class="hour-time">${formatHourLabel(hourly.time[i])}</div>
            <div class="hour-icon">${display.icon}</div>
            <div class="hour-temp">${cToDisplay(hourly.temperature_2m[i])}</div>
            <div class="hour-rain">${hourly.precipitation_probability[i] ?? 0}% rain</div>
          `;
          hourlyRow.appendChild(card);
        }

        const forecastRow = document.getElementById("forecastRow");
        forecastRow.innerHTML = "";

        daily.time.forEach((dateStr, index) => {
          const display = getWeatherDisplay(daily.weather_code[index]);
          const card = document.createElement("div");
          card.className = "forecast-card";
          card.innerHTML = `
            <div class="forecast-day">${formatDayLabel(dateStr, index)}</div>
            <div class="forecast-icon">${display.icon}</div>
            <div class="forecast-temps">${cToDisplay(daily.temperature_2m_max[index])} / ${cToDisplay(daily.temperature_2m_min[index])}</div>
            <div class="forecast-desc">${display.text}</div>
          `;
          forecastRow.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        document.getElementById("condition").textContent = "Unable to load weather";
        document.getElementById("updated").textContent = "Will retry automatically";
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
    fetchWeather();
    setInterval(fetchWeather, REFRESH_MS);
  </script>
